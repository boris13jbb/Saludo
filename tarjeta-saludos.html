<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Saludos Profesional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 1.5s ease;
            position: relative;
        }

        /* Fondos según la hora - Más sofisticados */
        body.morning {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        body.afternoon {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
        }

        body.night {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1a237e 100%);
        }

        /* Partículas de fondo mejoradas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: float linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor de imágenes decorativas */
        .image-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .decorative-image {
            position: absolute;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0.7;
            animation: floatImage 20s ease-in-out infinite;
            filter: blur(0.5px);
            transition: opacity 0.3s ease;
        }

        .decorative-image:hover {
            opacity: 1;
            filter: blur(0);
            z-index: 10;
        }

        .decorative-image.top-left {
            top: 5%;
            left: 5%;
            width: 160px;
            height: auto;
            animation-delay: 0s;
        }

        .decorative-image.top-right {
            top: 8%;
            right: 5%;
            width: 140px;
            height: auto;
            animation-delay: 2s;
        }

        .decorative-image.bottom-left {
            bottom: 10%;
            left: 8%;
            width: 150px;
            height: auto;
            animation-delay: 4s;
        }

        .decorative-image.bottom-right {
            bottom: 8%;
            right: 8%;
            width: 170px;
            height: auto;
            animation-delay: 6s;
        }

        .decorative-image.mid-left {
            top: 50%;
            left: 3%;
            transform: translateY(-50%);
            width: 130px;
            height: auto;
            animation-delay: 1s;
        }

        .decorative-image.mid-right {
            top: 50%;
            right: 3%;
            transform: translateY(-50%);
            width: 135px;
            height: auto;
            animation-delay: 3s;
        }

        @keyframes floatImage {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) translateX(10px) rotate(5deg);
            }
            50% {
                transform: translateY(-10px) translateX(-10px) rotate(-5deg);
            }
            75% {
                transform: translateY(-15px) translateX(5px) rotate(3deg);
            }
        }

        /* Contenedor de la tarjeta mejorado */
        .card-container {
            position: relative;
            z-index: 2;
            perspective: 1200px;
        }

        .greeting-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.95) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 40px;
            padding: 70px 90px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset,
                0 0 100px rgba(255, 255, 255, 0.1) inset;
            text-align: center;
            min-width: 550px;
            max-width: 90vw;
            animation: cardEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: visible;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes cardEntrance {
            0% {
                transform: scale(0.7) rotateY(15deg) translateY(50px);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotateY(0deg) translateY(0);
                opacity: 1;
            }
        }

        /* Brillo mejorado en la tarjeta */
        .card-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.4) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            animation: shine 4s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0%, 100% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            50% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        /* Imágenes dentro de la tarjeta */
        .card-images {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 40px;
        }

        .card-image {
            position: absolute;
            border-radius: 15px;
            opacity: 0.15;
            animation: cardImageFloat 15s ease-in-out infinite;
        }

        .card-image.img-1 {
            top: 10%;
            left: 5%;
            width: 110px;
            animation-delay: 0s;
        }

        .card-image.img-2 {
            top: 15%;
            right: 5%;
            width: 100px;
            animation-delay: 3s;
        }

        .card-image.img-3 {
            bottom: 15%;
            left: 8%;
            width: 105px;
            animation-delay: 6s;
        }

        .card-image.img-4 {
            bottom: 10%;
            right: 8%;
            width: 115px;
            animation-delay: 9s;
        }

        @keyframes cardImageFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.15;
            }
            50% {
                transform: translateY(-15px) scale(1.05);
                opacity: 0.25;
            }
        }

        /* Icono animado mejorado */
        .icon-container {
            font-size: 110px;
            margin-bottom: 25px;
            animation: bounce 2.5s ease-in-out infinite;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.2));
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .icon-container img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: bounce 2.5s ease-in-out infinite;
        }

        /* Input para cargar imagen */
        .image-upload-wrapper {
            position: relative;
            display: inline-block;
        }

        .image-upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            font-family: 'Poppins', sans-serif;
        }

        .image-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .image-upload-btn:active {
            transform: translateY(0);
        }

        .image-upload-input {
            display: none;
        }

        .remove-image-btn {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(245, 87, 108, 0.4);
            font-family: 'Poppins', sans-serif;
            margin-top: 5px;
        }

        .remove-image-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.6);
        }

        body.afternoon .image-upload-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        body.night .image-upload-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        /* Modal de administrador */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .admin-modal.active {
            display: flex;
        }

        .admin-modal-content {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: cardEntrance 0.5s ease;
        }

        .admin-modal-content h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
            font-weight: 700;
        }

        .admin-modal-content input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .admin-modal-content input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .admin-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .admin-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .admin-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .admin-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .admin-btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .admin-btn-secondary:hover {
            background: #e0e0e0;
        }

        .admin-error {
            color: #f5576c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .admin-error.show {
            display: block;
        }

        /* Botón de acceso admin (solo visible cuando no es admin) */
        .admin-access-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 999;
            display: none;
        }

        .admin-access-btn:hover {
            background: rgba(102, 126, 234, 1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .admin-access-btn.show {
            display: block;
        }

        /* Ocultar controles cuando no es admin */
        .admin-only {
            display: none;
        }

        .admin-only.show {
            display: block;
        }

        .image-upload-wrapper.admin-only {
            display: none;
        }

        .image-upload-wrapper.admin-only.show {
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) scale(1.08) rotate(5deg);
            }
        }

        /* Texto principal mejorado */
        .greeting-text {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            animation: textGlow 3s ease-in-out infinite;
            letter-spacing: -1px;
            line-height: 1.2;
            position: relative;
            z-index: 1;
        }

        body.afternoon .greeting-text {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.night .greeting-text {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes textGlow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.4));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(102, 126, 234, 0.7));
                transform: scale(1.02);
            }
        }

        /* Mensaje mejorado */
        .message {
            font-size: 22px;
            color: #444;
            margin-bottom: 20px;
            animation: fadeIn 1.2s ease-in 0.6s both;
            line-height: 1.8;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Reloj mejorado */
        .time-display {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
            animation: fadeIn 1.2s ease-in 1.2s both;
            letter-spacing: 4px;
            padding: 15px 30px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Decoración inferior mejorada */
        .decoration {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
            animation: fadeIn 1.2s ease-in 1.8s both;
            position: relative;
            z-index: 1;
        }

        .decoration span {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .decoration span:nth-child(2) {
            animation-delay: 0.4s;
        }

        .decoration span:nth-child(3) {
            animation-delay: 0.8s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.6);
                opacity: 0.6;
            }
        }

        /* Pie de página */
        .footer {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px solid rgba(102, 126, 234, 0.2);
            animation: fadeIn 1.2s ease-in 2s both;
            position: relative;
            z-index: 1;
        }

        .footer-text {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            letter-spacing: 1px;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        body.afternoon .footer-text {
            color: #f5576c;
            text-shadow: 0 2px 10px rgba(245, 87, 108, 0.3);
        }

        body.night .footer-text {
            color: #2a5298;
            text-shadow: 0 2px 10px rgba(42, 82, 152, 0.3);
        }

        /* Responsive mejorado */
        @media (max-width: 768px) {
            .greeting-card {
                padding: 50px 35px;
                min-width: auto;
                width: 92vw;
                border-radius: 30px;
            }

            .greeting-text {
                font-size: 38px;
            }

            .icon-container {
                font-size: 80px;
            }

            .icon-container img {
                width: 120px;
                height: 120px;
            }

            .image-upload-btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            .remove-image-btn {
                padding: 6px 12px;
                font-size: 11px;
            }

            .message {
                font-size: 18px;
            }

            .footer {
                margin-top: 30px;
                padding-top: 20px;
            }

            .footer-text {
                font-size: 16px;
            }

            .time-display {
                font-size: 24px;
                padding: 12px 20px;
                letter-spacing: 2px;
            }

            .decorative-image {
                width: 90px !important;
                opacity: 0.5;
            }

            .card-image {
                width: 70px !important;
            }
        }

        @media (max-width: 480px) {
            .decorative-image {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Imágenes decorativas alrededor -->
    <div class="image-decoration">
        <img src="image/hello.gif" alt="Hello" class="decorative-image top-left">
        <img src="image/dias.gif" alt="Días" class="decorative-image top-right">
        <img src="image/as.gif" alt="Decoración" class="decorative-image bottom-left">
        <img src="image/jh.gif" alt="Decoración" class="decorative-image bottom-right">
        <img src="image/unnamed.gif" alt="Decoración" class="decorative-image mid-left">
        <img src="image/asd.gif" alt="Decoración" class="decorative-image mid-right">
    </div>

    <!-- Tarjeta de saludo -->
    <div class="card-container">
        <div class="greeting-card">
            <div class="card-shine"></div>
            
            <!-- Imágenes dentro de la tarjeta -->
            <div class="card-images">
                <img src="image/ax.gif" alt="Decoración" class="card-image img-1">
                <img src="image/qw.gif" alt="Decoración" class="card-image img-2">
                <img src="image/as.gif" alt="Decoración" class="card-image img-3">
                <img src="image/hello.gif" alt="Decoración" class="card-image img-4">
            </div>
            
            <div class="icon-container" id="icon">
                <span id="icon-emoji">🌅</span>
                <img id="icon-image" style="display: none;" alt="Imagen personalizada">
                <div class="image-upload-wrapper admin-only" id="image-upload-wrapper">
                    <input type="file" id="image-upload" class="image-upload-input" accept="image/*">
                    <label for="image-upload" class="image-upload-btn">📷 Cargar Imagen</label>
                    <button id="remove-image" class="remove-image-btn" style="display: none;">✖️ Quitar Imagen</button>
                </div>
            </div>
            
            <h1 class="greeting-text" id="greeting">
                Buenos Días
            </h1>
            
            <p class="message" id="message">
                Que tengas un día maravilloso lleno de energía y éxito
            </p>
            
            <div class="time-display" id="time">
                00:00:00
            </div>
            
            <div class="decoration">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <div class="footer">
                <p class="footer-text">Primo Juan B</p>
            </div>
        </div>
    </div>

    <!-- Botón de acceso admin -->
    <button class="admin-access-btn" id="admin-access-btn">🔐 Admin</button>

    <!-- Modal de administrador -->
    <div class="admin-modal" id="admin-modal">
        <div class="admin-modal-content">
            <h2>Acceso de Administrador</h2>
            <input type="password" id="admin-password" placeholder="Ingrese la contraseña" autocomplete="off">
            <div class="admin-error" id="admin-error">Contraseña incorrecta</div>
            <div class="admin-modal-buttons">
                <button class="admin-btn admin-btn-primary" id="admin-login-btn">Iniciar Sesión</button>
                <button class="admin-btn admin-btn-secondary" id="admin-cancel-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Configuración de administrador
        const ADMIN_PASSWORD = 'admin123'; // Cambia esta contraseña por la que desees
        const ADMIN_IMAGE_KEY = 'adminIconImage';
        const ADMIN_SESSION_KEY = 'isAdmin';

        // Verificar si es administrador
        function isAdmin() {
            return localStorage.getItem(ADMIN_SESSION_KEY) === 'true';
        }

        // Establecer estado de administrador
        function setAdminStatus(isAdmin) {
            if (isAdmin) {
                localStorage.setItem(ADMIN_SESSION_KEY, 'true');
            } else {
                localStorage.removeItem(ADMIN_SESSION_KEY);
            }
            updateAdminUI();
        }

        // Actualizar interfaz según estado de admin
        function updateAdminUI() {
            const isAdminUser = isAdmin();
            const uploadWrapper = document.getElementById('image-upload-wrapper');
            const adminAccessBtn = document.getElementById('admin-access-btn');

            if (isAdminUser) {
                // Mostrar controles de administrador
                if (uploadWrapper) {
                    uploadWrapper.classList.add('show');
                }
                // Ocultar botón de acceso
                if (adminAccessBtn) {
                    adminAccessBtn.classList.remove('show');
                }
            } else {
                // Ocultar controles de administrador
                if (uploadWrapper) {
                    uploadWrapper.classList.remove('show');
                }
                // Mostrar botón de acceso
                if (adminAccessBtn) {
                    adminAccessBtn.classList.add('show');
                }
            }
        }

        // Configuración de imágenes según la hora del día
        const imageConfig = {
            morning: {
                outer: ['image/hello.gif', 'image/dias.gif', 'image/as.gif', 'image/jh.gif', 'image/unnamed.gif', 'image/asd.gif'],
                inner: ['image/ax.gif', 'image/qw.gif', 'image/as.gif', 'image/hello.gif']
            },
            afternoon: {
                outer: ['image/hello.gif', 'image/dias.gif', 'image/asd.gif', 'image/qw.gif', 'image/ax.gif', 'image/jh.gif'],
                inner: ['image/qw.gif', 'image/ax.gif', 'image/hello.gif', 'image/dias.gif']
            },
            night: {
                outer: ['image/unnamed.gif', 'image/jh.gif', 'image/as.gif', 'image/asd.gif', 'image/hello.gif', 'image/dias.gif'],
                inner: ['image/as.gif', 'image/unnamed.gif', 'image/jh.gif', 'image/asd.gif']
            }
        };

        // Función para crear partículas mejoradas
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 6 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 12 + 12) + 's';
                particle.style.animationDelay = Math.random() * 6 + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Función para actualizar imágenes según la hora
        function updateImages(period) {
            const config = imageConfig[period];
            const outerImages = document.querySelectorAll('.decorative-image');
            const innerImages = document.querySelectorAll('.card-image');

            // Actualizar imágenes exteriores
            outerImages.forEach((img, index) => {
                if (config.outer[index]) {
                    img.src = config.outer[index];
                    img.style.animationDelay = (index * 1.5) + 's';
                }
            });

            // Actualizar imágenes interiores
            innerImages.forEach((img, index) => {
                if (config.inner[index]) {
                    img.src = config.inner[index];
                    img.style.animationDelay = (index * 2) + 's';
                }
            });
        }

        // Función para actualizar el saludo según la hora
        function updateGreeting() {
            const now = new Date();
            const hour = now.getHours();
            const greetingElement = document.getElementById('greeting');
            const messageElement = document.getElementById('message');
            const iconEmojiElement = document.getElementById('icon-emoji');
            const body = document.body;

            // Limpiar clases anteriores
            body.classList.remove('morning', 'afternoon', 'night');

            let period = 'morning';
            let emoji = '🌅';

            if (hour >= 6 && hour < 12) {
                // Buenos días (6:00 - 11:59)
                greetingElement.textContent = '¡Buenos Días Familia!';
                messageElement.textContent = 'Que tengan un día maravilloso lleno de energía y éxito';
                emoji = '🌅';
                body.classList.add('morning');
                period = 'morning';
            } else if (hour >= 12 && hour < 20) {
                // Buenas tardes (12:00 - 19:59)
                greetingElement.textContent = '¡Buenas Tardes Familia!';
                messageElement.textContent = 'Que su tarde esté llena de momentos especiales y productividad';
                emoji = '☀️';
                body.classList.add('afternoon');
                period = 'afternoon';
            } else {
                // Buenas noches (20:00 - 5:59)
                greetingElement.textContent = '¡Buenas Noches Familia!';
                messageElement.textContent = 'Que tengan una noche tranquila y un merecido descanso';
                emoji = '🌙';
                body.classList.add('night');
                period = 'night';
            }

            // Solo actualizar el emoji si no hay imagen del administrador cargada
            const iconImage = document.getElementById('icon-image');
            if (iconImage && iconImage.style.display === 'none') {
                iconEmojiElement.textContent = emoji;
            }

            // Actualizar imágenes según el período
            updateImages(period);
        }

        // Función para cargar imagen del administrador (visible para todos)
        function loadAdminImage() {
            const savedImage = localStorage.getItem(ADMIN_IMAGE_KEY);
            if (savedImage) {
                const iconImage = document.getElementById('icon-image');
                const iconEmoji = document.getElementById('icon-emoji');
                const removeBtn = document.getElementById('remove-image');
                
                iconImage.src = savedImage;
                iconImage.style.display = 'block';
                iconEmoji.style.display = 'none';
                
                // Solo mostrar botón de quitar si es admin
                if (isAdmin() && removeBtn) {
                    removeBtn.style.display = 'block';
                } else if (removeBtn) {
                    removeBtn.style.display = 'none';
                }
            }
        }

        // Función para guardar imagen del administrador
        function saveAdminImage(imageSrc) {
            localStorage.setItem(ADMIN_IMAGE_KEY, imageSrc);
        }

        // Función para eliminar imagen del administrador (solo admin puede hacerlo)
        function removeAdminImage() {
            if (!isAdmin()) return;
            
            const iconImage = document.getElementById('icon-image');
            const iconEmoji = document.getElementById('icon-emoji');
            const removeBtn = document.getElementById('remove-image');
            
            iconImage.style.display = 'none';
            iconImage.src = '';
            iconEmoji.style.display = 'block';
            if (removeBtn) {
                removeBtn.style.display = 'none';
            }
            
            localStorage.removeItem(ADMIN_IMAGE_KEY);
            
            // Actualizar el emoji según la hora actual
            updateGreeting();
        }

        // Manejar carga de imagen (solo para administrador)
        function setupImageUpload() {
            const imageUpload = document.getElementById('image-upload');
            const iconImage = document.getElementById('icon-image');
            const iconEmoji = document.getElementById('icon-emoji');
            const removeBtn = document.getElementById('remove-image');

            if (!imageUpload) return;

            imageUpload.addEventListener('change', function(e) {
                if (!isAdmin()) return;
                
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const imageSrc = event.target.result;
                        iconImage.src = imageSrc;
                        iconImage.style.display = 'block';
                        iconEmoji.style.display = 'none';
                        if (removeBtn) {
                            removeBtn.style.display = 'block';
                        }
                        
                        // Guardar imagen del administrador
                        saveAdminImage(imageSrc);
                    };
                    reader.readAsDataURL(file);
                }
            });

            if (removeBtn) {
                removeBtn.addEventListener('click', removeAdminImage);
            }
        }

        // Manejar login de administrador
        function setupAdminLogin() {
            const adminModal = document.getElementById('admin-modal');
            const adminAccessBtn = document.getElementById('admin-access-btn');
            const adminLoginBtn = document.getElementById('admin-login-btn');
            const adminCancelBtn = document.getElementById('admin-cancel-btn');
            const adminPasswordInput = document.getElementById('admin-password');
            const adminError = document.getElementById('admin-error');

            // Abrir modal
            if (adminAccessBtn) {
                adminAccessBtn.addEventListener('click', function() {
                    if (adminModal) {
                        adminModal.classList.add('active');
                        if (adminPasswordInput) {
                            adminPasswordInput.focus();
                        }
                    }
                });
            }

            // Cerrar modal
            if (adminCancelBtn) {
                adminCancelBtn.addEventListener('click', function() {
                    if (adminModal) {
                        adminModal.classList.remove('active');
                    }
                    if (adminPasswordInput) {
                        adminPasswordInput.value = '';
                    }
                    if (adminError) {
                        adminError.classList.remove('show');
                    }
                });
            }

            // Login
            if (adminLoginBtn) {
                adminLoginBtn.addEventListener('click', function() {
                    const password = adminPasswordInput ? adminPasswordInput.value : '';
                    
                    if (password === ADMIN_PASSWORD) {
                        setAdminStatus(true);
                        if (adminModal) {
                            adminModal.classList.remove('active');
                        }
                        if (adminPasswordInput) {
                            adminPasswordInput.value = '';
                        }
                        if (adminError) {
                            adminError.classList.remove('show');
                        }
                    } else {
                        if (adminError) {
                            adminError.classList.add('show');
                        }
                        if (adminPasswordInput) {
                            adminPasswordInput.value = '';
                            adminPasswordInput.focus();
                        }
                    }
                });
            }

            // Login con Enter
            if (adminPasswordInput) {
                adminPasswordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        if (adminLoginBtn) {
                            adminLoginBtn.click();
                        }
                    }
                });
            }

            // Cerrar modal al hacer clic fuera
            if (adminModal) {
                adminModal.addEventListener('click', function(e) {
                    if (e.target === adminModal) {
                        adminModal.classList.remove('active');
                        if (adminPasswordInput) {
                            adminPasswordInput.value = '';
                        }
                        if (adminError) {
                            adminError.classList.remove('show');
                        }
                    }
                });
            }
        }

        // Función para actualizar el reloj
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Función para agregar efecto parallax a las imágenes
        function initParallax() {
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                const images = document.querySelectorAll('.decorative-image');
                images.forEach((img, index) => {
                    const speed = (index + 1) * 0.5;
                    const x = (mouseX - 0.5) * speed * 20;
                    const y = (mouseY - 0.5) * speed * 20;
                    img.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        }

        // Inicializar
        createParticles();
        setupAdminLogin();
        updateAdminUI(); // Actualizar UI según estado de admin
        setupImageUpload();
        loadAdminImage(); // Cargar imagen del administrador (visible para todos)
        updateGreeting();
        updateClock();
        initParallax();

        // Actualizar reloj cada segundo
        setInterval(updateClock, 1000);

        // Verificar cambio de período cada minuto
        setInterval(updateGreeting, 60000);

        // Pre-cargar todas las imágenes para mejor rendimiento
        window.addEventListener('load', () => {
            const allImages = [
                'image/hello.gif', 'image/dias.gif', 'image/as.gif', 
                'image/jh.gif', 'image/unnamed.gif', 'image/asd.gif',
                'image/ax.gif', 'image/qw.gif'
            ];
            
            allImages.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        });
    </script>
</body>
</html>
